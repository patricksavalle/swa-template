name: Setup Node project
description: Set up the pinned Node.js runtime and install npm dependencies.

inputs:
  node-version:
    description: Node.js major version to install.
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
