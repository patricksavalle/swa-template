name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-test:
    name: Validate, Build, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify npm signatures (advisory)
        continue-on-error: true
        run: npm audit signatures

      - name: Run CI checks
        run: npm run ci

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xzf - -C /usr/local/bin gitleaks

      - name: Secret scan
        run: gitleaks detect --source . --redact --verbose --no-banner

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-web-artifact-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact-${{ github.sha }}
          path: |
            api/host.json
            api/package.json
            api/health/function.json
            api/dist/**
          if-no-files-found: error
          retention-days: 14
