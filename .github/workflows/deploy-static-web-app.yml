name: Deploy Static Web App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: acceptance
        type: choice
        options:
          - acceptance
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build once
        run: npm run ci

      - name: Upload immutable artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-web-artifact-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact-${{ github.sha }}
          path: |
            api/host.json
            api/package.json
            api/health/function.json
            api/dist/**
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
    environment: ${{ inputs.environment }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure names
        id: names
        shell: bash
        run: |
          raw="${{ vars.APP_NAME }}"
          if [ -z "$raw" ]; then raw="${GITHUB_REPOSITORY#*/}"; fi
          app_name="$(echo "$raw" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g' \
            | sed 's/--*/-/g' \
            | sed 's/^-//;s/-$//')"

          case "${{ inputs.environment }}" in
            acceptance)
              suffix="acc"
              ;;
            production)
              suffix="prd"
              ;;
          esac

          resource_prefix="${app_name}-${suffix}"
          echo "resource_group=rg-${resource_prefix}" >> "$GITHUB_OUTPUT"
          echo "swa_name=swa-${resource_prefix}" >> "$GITHUB_OUTPUT"

      - name: Download immutable artifact
        uses: actions/download-artifact@v4
        with:
          name: static-web-artifact-${{ github.sha }}
          path: dist/

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-artifact-${{ github.sha }}
          path: api/

      - name: Read SWA deployment token
        id: swa-token
        shell: bash
        run: |
          token="$(az staticwebapp secrets list \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --name "${{ steps.names.outputs.swa_name }}" \
            --query 'properties.apiKey' \
            --output tsv)"
          default_hostname="$(az staticwebapp show \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --name "${{ steps.names.outputs.swa_name }}" \
            --query 'defaultHostname' \
            --output tsv)"
          if [ -z "$default_hostname" ]; then
            echo "ERROR: Could not resolve SWA default hostname."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "default_hostname=$default_hostname" >> "$GITHUB_OUTPUT"

      - name: Deploy artifact
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: dist
          api_location: ${{ vars.SWA_API_LOCATION || '' }}
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Health check
        shell: bash
        run: |
          url="https://${{ steps.swa-token.outputs.default_hostname }}/"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors "$url" >/dev/null
          echo "Health check OK: $url"
