name: Deploy Static Web App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: acceptance
        type: choice
        options:
          - acceptance
          - production

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  production-gate:
    name: Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require acceptance smoke for production
        if: inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          run_count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/acceptance-smoke.yml/runs?per_page=100&status=completed" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${TARGET_SHA}\" and .conclusion == \"success\")] | length")"

          if [ "$run_count" -lt 1 ]; then
            echo "ERROR: Production deployment requires a successful Acceptance Smoke run for ${TARGET_SHA}."
            echo "Run the Acceptance Smoke workflow on this commit after acceptance is deployed."
            exit 1
          fi

          echo "Acceptance smoke gate satisfied for ${TARGET_SHA}."

      - name: Skip gate for non-production
        if: inputs.environment != 'production'
        run: echo "Production gate skipped for ${{ inputs.environment }}."

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - production-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node project
        uses: ./.github/actions/setup-node-project

      - name: Build once
        run: npm run ci

      - name: Upload immutable artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-web-artifact-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-artifact-${{ github.sha }}
          path: |
            api/host.json
            api/package.json
            api/*/function.json
            api/dist/**
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Azure names
        id: names
        uses: ./.github/actions/resolve-azure-names
        with:
          environment: ${{ inputs.environment }}
          app-name: ${{ vars.APP_NAME }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download immutable artifact
        uses: actions/download-artifact@v8
        with:
          name: static-web-artifact-${{ github.sha }}
          path: dist/

      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: api-artifact-${{ github.sha }}
          path: api/

      - name: Read SWA deployment token
        id: swa-token
        shell: bash
        run: |
          token="$(az staticwebapp secrets list \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --name "${{ steps.names.outputs.swa_name }}" \
            --query 'properties.apiKey' \
            --output tsv)"
          default_hostname="$(az staticwebapp show \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --name "${{ steps.names.outputs.swa_name }}" \
            --query 'defaultHostname' \
            --output tsv)"
          if [ -z "$default_hostname" ]; then
            echo "ERROR: Could not resolve SWA default hostname."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "default_hostname=$default_hostname" >> "$GITHUB_OUTPUT"

      - name: Deploy artifact
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          skip_app_build: true

      - name: Health check
        shell: bash
        run: |
          origin="https://${{ steps.swa-token.outputs.default_hostname }}"
          for path in "/" "/api/health" "/api/resources"; do
            url="${origin}${path}"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors "$url" >/dev/null
            echo "Health check OK: $url"
          done
