name: Deploy Static Web App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: acceptance
        type: choice
        options:
          - acceptance
          - production

permissions:
  contents: read
  id-token: write

env:
  SWA_APP_LOCATION: .
  SWA_API_LOCATION: api
  SWA_OUTPUT_LOCATION: dist

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build once
        run: npm run ci

      - name: Upload immutable artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-web-artifact-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
    environment: ${{ inputs.environment }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure names
        id: names
        shell: bash
        run: |
          case "${{ inputs.environment }}" in
            acceptance)
              echo "resource_group=rg-l-gevity-acc" >> "$GITHUB_OUTPUT"
              echo "swa_name=swa-l-gevity-acc" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "resource_group=rg-l-gevity-prd" >> "$GITHUB_OUTPUT"
              echo "swa_name=swa-l-gevity-prd" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Download immutable artifact
        uses: actions/download-artifact@v4
        with:
          name: static-web-artifact-${{ github.sha }}
          path: dist/

      - name: Read SWA deployment token
        id: swa-token
        shell: bash
        run: |
          token="$(az staticwebapp secrets list \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --name "${{ steps.names.outputs.swa_name }}" \
            --query 'properties.apiKey' \
            --output tsv)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy artifact
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Health check
        run: |
          echo "Replace this with a real health check before production use."
