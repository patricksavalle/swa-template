name: Provision Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: acceptance
        type: choice
        options:
          - acceptance
          - production
      location:
        description: Azure region for regional resources
        required: true
        default: westeurope
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  provision:
    name: Provision ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Azure names
        id: names
        uses: ./.github/actions/resolve-azure-names
        with:
          environment: ${{ inputs.environment }}
          app-name: ${{ vars.APP_NAME }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        shell: bash
        run: |
          az group create \
            --name "${{ steps.names.outputs.resource_group }}" \
            --location "${{ inputs.location }}"

      - name: Provision resources
        shell: bash
        run: |
          az deployment group create \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/environments/${{ inputs.environment }}.bicepparam \
            --parameters \
              location="${{ inputs.location }}" \
              projectName="${{ steps.names.outputs.app_name }}" \
              resourceNamePrefix="${{ steps.names.outputs.resource_prefix }}" \
              cosmosDatabaseName="app" \
              ciamTenantId="${{ secrets.CIAM_TENANT_ID }}" \
              ciamTenantName="${{ secrets.CIAM_TENANT_NAME }}" \
              ciamClientId="${{ secrets.CIAM_CLIENT_ID }}"

      - name: Seed application settings
        uses: ./.github/actions/seed-azure-app-settings
        with:
          resource-group: ${{ steps.names.outputs.resource_group }}
          swa-name: ${{ steps.names.outputs.swa_name }}
          cosmos-name: ${{ steps.names.outputs.cosmos_name }}
          ciam-client-secret: ${{ secrets.CIAM_CLIENT_SECRET }}
