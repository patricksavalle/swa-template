name: Seed Azure App Settings

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: acceptance
        type: choice
        options:
          - acceptance
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: seed-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  seed:
    name: Seed ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Azure names
        id: names
        uses: ./.github/actions/resolve-azure-names
        with:
          environment: ${{ inputs.environment }}
          app-name: ${{ vars.APP_NAME }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Seed application settings
        uses: ./.github/actions/seed-azure-app-settings
        with:
          resource-group: ${{ steps.names.outputs.resource_group }}
          swa-name: ${{ steps.names.outputs.swa_name }}
          cosmos-name: ${{ steps.names.outputs.cosmos_name }}
          ciam-client-secret: ${{ secrets.CIAM_CLIENT_SECRET }}
