<article class="h-full rounded-lg border border-slate-200 p-5 shadow-sm transition duration-150 hover:-translate-y-0.5 hover:shadow-lg dark:border-slate-800 {{ feature.tone | default('bg-sky-50 dark:bg-sky-950') }}">
  <p class="mb-2 text-xs font-bold uppercase text-blue-700 dark:text-blue-300">{{ feature.kicker }}</p>
  <h3 class="mb-3 text-xl font-semibold text-slate-950 dark:text-white">{{ feature.title }}</h3>
  <p class="mb-0 text-slate-700 dark:text-slate-300">{{ feature.description }}</p>
</article>
